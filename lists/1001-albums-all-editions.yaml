# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  1001 Albums You Must Hear Before You Die — every edition, combined       ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Every album that has ever been in the book, first edition (2005) through the
# 2026 edition: 1102 albums. One list = one source; this file is that source,
# turned into MusicBrainz Release Group IDs.
#
# WHY Discogs and not the MusicBrainz series: MB has the book as "Release group
# series", but only the 2005 edition is complete there (and even it misses the
# White Album and American Idiot, with "It Takes a Nation of Millions" listed
# twice). Later editions on MB hold only a handful of additions each.
#
# How the IDs were found (2026-11-01, Stefan + Claude, by hand — not mk3 code):
#   - each Discogs master was mapped via MusicBrainz' OWN url relationship
#     (release group -> discogs.com/master/<id>), so no title guessing;
#   - 12 masters linked to two release groups (original + tribute / deluxe /
#     single); the original was taken, confirmed by the MB 2005 series;
#   - Mon Rovîa "Bloodline" had no link yet -> found by MB search;
#   - Nusrat Fateh Ali Khan: Discogs lists "Devotional and Love Songs", Stefan
#     chose "Devotional Songs" (1992), matching the MB 2005 series.
#
# No `pos`: the book is chronological, not a ranking, so file order is enough.
# `rgid` is the truth; `title` is only there so humans (and git diffs) can read it.

